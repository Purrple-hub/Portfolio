<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PurpleXPurple – Links</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>

<header class="site-header">
    <div class="logo">
        <img src="logo.png" alt="PurpleXPurple Logo" />
        <span class="logo-text">PurpleXPurple</span>
    </div>
    <nav class="main-nav" aria-label="Main navigation">
        <ul>
            <li><a href="#home">Home</a></li>
            <li><a href="#about">About</a></li>
            <li><a href="#contact">Contact</a></li>
        </ul>
    </nav>
</header>

    <main>
        <!-- HOME -->
        <section id="home" class="section">
            <h1>PurpleXPurple</h1>
            <p id="bio-text">Loading bio…</p>
        </section>

        <!-- ABOUT -->
        <section id="about" class="section">
            <h2>About</h2>
            <p>
                I'm PurpleXPurple. I exist on the internet – find me through the
                links below.
            </p>
        </section>

        <!-- CONTACT -->
        <section id="contact" class="section">
            <h2>Contact</h2>
            <p id="contact-text">Loading contact info…</p>
        </section>

        <!-- LINKS (dynamic) -->
        <section id="links" class="section">
            <h2>My Links</h2>
            <div id="link-container" class="link-grid">
                <p>Loading your links…</p>
            </div>
        </section>
    </main>

    <script src="web.js"></script>
</body>
</html>
